[build]
  publish = "."
  # Plain static files, no build step. An explicit command stops Netlify from
  # guessing a framework (config.json makes it detect Hugo).
  command = "echo 'No build step: static files'"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
