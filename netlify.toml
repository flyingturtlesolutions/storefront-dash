[build]
  publish = "."
  # Writes version.json (file hashes) so open dashboards reload changed parts.
  # Also stops Netlify guessing a framework (config.json makes it detect Hugo).
  command = "node scripts/version.mjs"

[[headers]]
  for = "/*"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"
